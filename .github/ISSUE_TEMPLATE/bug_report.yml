name: Bug report
description: Something in Spency isn't working as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to Inbox
        2. Swipe a card right
        3. ...
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options:
        - Demo (no account)
        - Signed in (Supabase)
        - Self-hosted
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser, device and currency
      placeholder: Safari on iPhone 15, EUR
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or console errors
      description: Please remove any real balances or personal details first.
