<!-- Supabase → Authentication → Emails → Reset password. Subject: Reset your Spency password -->
<div style="font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 480px; margin: 0 auto; padding: 32px 24px; color: #111214">
  <p style="font-size: 17px; font-weight: 600; margin: 0 0 24px">spency</p>
  <h1 style="font-size: 22px; font-weight: 500; margin: 0 0 8px">Reset your password</h1>
  <p style="font-size: 15px; line-height: 1.5; color: #5f646c; margin: 0 0 24px">Choose a new password for your Spency account. This link works once, on any device.</p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password"
     style="display: inline-block; background: #111214; color: #ffffff; text-decoration: none; padding: 12px 22px; border-radius: 999px; font-size: 15px; font-weight: 500">
    Choose a new password
  </a>
  <p style="font-size: 13px; color: #9a9fa6; margin: 28px 0 0">Didn't ask for this? Your password stays the same.</p>
</div>
